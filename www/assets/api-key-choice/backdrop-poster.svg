<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <!-- Arka plan videosu (backdrop.mp4) için yerel poster / geri düşüş.
       Video dosyası yoksa veya yüklenene kadar bu poster gösterilir.
       Tamamen yereldir; dış kaynak yoktur. -->
  <defs>
    <radialGradient id="akcPosterA" cx="18%" cy="8%" r="80%">
      <stop offset="0%" stop-color="#1b3a6b" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0c1320" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>
    <radialGradient id="akcPosterB" cx="92%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#0e6b73" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#akcPosterA)"/>
  <rect width="1280" height="720" fill="url(#akcPosterB)"/>
  <g fill="#9fc6ff" fill-opacity="0.18">
    <circle cx="220" cy="180" r="3"/>
    <circle cx="420" cy="120" r="2"/>
    <circle cx="980" cy="200" r="3"/>
    <circle cx="1120" cy="320" r="2"/>
    <circle cx="640" cy="80" r="2"/>
    <circle cx="300" cy="520" r="2"/>
    <circle cx="860" cy="560" r="3"/>
  </g>
  <g stroke="#6fa8ff" stroke-opacity="0.12" stroke-width="1">
    <line x1="220" y1="180" x2="420" y2="120"/>
    <line x1="420" y1="120" x2="640" y2="80"/>
    <line x1="980" y1="200" x2="1120" y2="320"/>
    <line x1="640" y1="80" x2="980" y2="200"/>
  </g>
</svg>
