name: PR 694 final Codex fixes

on:
  push:
    branches:
      - pk/rebuild
    paths:
      - .github/workflows/pr694-final-codex-fixes.yml

permissions:
  contents: write

jobs:
  patch-document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pk/rebuild
          fetch-depth: 2

      - name: Recover and run the reviewed patch
        shell: bash
        run: |
          git show HEAD^:.github/workflows/pr694-final-codex-fixes.yml > /tmp/pr694-patch-source.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/pr694-patch-source.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/pr694-patch.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/pr694-patch.py
          rm -f .github/workflows/pr694-final-codex-fixes.yml

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/pr694-final-codex-fixes.yml docs/proje-kaynak-analizi-master-plan.md "
          ! grep -q 'best score \*\*31\*\*' docs/proje-kaynak-analizi-master-plan.md
          grep -q 'best score \*\*0\*\*' docs/proje-kaynak-analizi-master-plan.md
          grep -q 'Five changes deliberately cross both engines' docs/proje-kaynak-analizi-master-plan.md
          grep -q 'genuinely byte-limited streaming' docs/proje-kaynak-analizi-master-plan.md
          grep -q 'download callback immediately before' docs/proje-kaynak-analizi-master-plan.md
          grep -q 'git check-ignore -q' docs/proje-kaynak-analizi-master-plan.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/pr694-final-codex-fixes.yml docs/proje-kaynak-analizi-master-plan.md
          git commit -m "docs: address final Codex review findings"
          git push origin HEAD:pk/rebuild
