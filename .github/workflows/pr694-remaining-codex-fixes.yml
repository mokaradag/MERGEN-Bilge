name: PR 694 remaining Codex fixes

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  patch-document:
    if: github.event.pull_request.number == 694 && github.event.pull_request.head.ref == 'pk/rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pk/rebuild
          fetch-depth: 1

      - name: Apply remaining review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/proje-kaynak-analizi-master-plan.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "and ask for exactly that many candidate **ids**.\nThe minimum of two is part of the safety contract: a one-candidate recall cannot supply\nthe runner-up confidence needed to enforce `MERGEN_PK_SELECT_MIN_MARGIN`. Full recall\nby construction applies over the supplied semantic fields.",
                  "and ask for exactly that many candidate **ids**.\n\nPass A also receives a bounded follow-up context envelope: the last two relevant\nconversation turns and the prior stable selected query id, when that id still exists\nin the current library. For an elliptical follow-up such as `peki 2024 için?`, seed\nthat prior id into the candidate set **before** applying the resolved recall-count\nlimit, de-duplicate it against newly recalled ids, and fill the remaining slots from\nthe full-library recall result. Pass B must still validate its capabilities and may\nreject it, but Pass A must never discard the only query-bearing context before Pass B\ncan inspect the conversation. The minimum of two is part of the safety contract: a\none-candidate recall cannot supply the runner-up confidence needed to enforce\n`MERGEN_PK_SELECT_MIN_MARGIN`. Full recall by construction applies over the supplied\nsemantic fields and bounded follow-up context."
              ),
              (
                  "* Record the RLS scope in provenance (rows before/after, which rule applied).",
                  "* Record the RLS scope only in restricted server telemetry: pre-RLS row count,\n  authorized row count, and the rule applied. Never place the pre-RLS count in\n  user-visible provenance, export metadata, or any model-facing packet."
              ),
              (
                  "Filters         applied filters, resolved canonical entities, rows before/after RLS & filter",
                  "Filters         applied filters, resolved canonical entities, authorized rows before user filter, rows after filter"
              ),
              (
                  "Limitations     what this query cannot answer; what was truncated\n```\n\n**Sparse/non-finite numeric measures have an explicit availability contract.**",
                  "Limitations     what this query cannot answer; what was truncated\n```\n\nThe model-facing packet contains **no pre-RLS row count**. For scoped users, that\nvalue exists exclusively in access-restricted server telemetry and is never sent to\nthe LLM, cited in prose, written to the `Bilgi` sheet, or exposed through the footer.\nThe packet may expose only the authorized population before user filters and the\npost-filter population. Numeric provenance checks must reject any attempted citation\nof a pre-RLS count because no such structured fact is available to composition.\n\n**Sparse/non-finite numeric measures have an explicit availability contract.**"
              ),
              (
                  "| `test-pk-query-selection-contract.R` | resolved `MERGEN_PK_SELECT_RECALL_N` (minimum 2) controls both Pass-A requested IDs and Pass-B candidate input; non-default value 3 is honored; fewer than two validated confidences returns `no_runner_up`; no literal five; stable IDs and alternate confidences |",
                  "| `test-pk-query-selection-contract.R` | resolved `MERGEN_PK_SELECT_RECALL_N` (minimum 2) controls both Pass-A requested IDs and Pass-B candidate input; non-default value 3 is honored; fewer than two validated confidences returns `no_runner_up`; no literal five; stable IDs and alternate confidences; bounded follow-up context plus the prior stable query id is included in Pass A, and an elliptical follow-up retains that id before recall truncation |"
              ),
              (
                  "| `test-pk-analysis-packet-behavior.R` | additive vs non-additive; zero/one/finite sparse-measure availability contract (no all-missing zero, no `NA`/`NaN`/`Inf` fact); weighted means exclude disclosed missing/zero pairs, reject negative/non-finite weights, and return unavailable when no positive weight remains; stable `latest_by` + unique `latest_tie_by`; duplicate newest-row ties return `ambiguous_latest`; structured fact IDs and semantic context; budget accountant; stratified sample; `FİLTRELEME UYARISI` survives degradation (D7, D8) |",
                  "| `test-pk-analysis-packet-behavior.R` | additive vs non-additive; zero/one/finite sparse-measure availability contract (no all-missing zero, no `NA`/`NaN`/`Inf` fact); weighted means exclude disclosed missing/zero pairs, reject negative/non-finite weights, and return unavailable when no positive weight remains; stable `latest_by` + unique `latest_tie_by`; duplicate newest-row ties return `ambiguous_latest`; structured fact IDs and semantic context; budget accountant; stratified sample; `FİLTRELEME UYARISI` survives degradation (D7, D8); the model-facing packet contains authorized-before-filter and after-filter counts only, never a pre-RLS count |"
              ),
              (
                  "recall@N is measured on the golden set, including a case whose distinguishing phrase\nappears only in `sample_questions`.",
                  "recall@N is measured on the golden set, including a case whose distinguishing phrase\nappears only in `sample_questions`, plus an elliptical follow-up whose prior stable\nquery id must be retained in Pass A before truncation."
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/pr694-remaining-codex-fixes.yml

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/pr694-remaining-codex-fixes.yml docs/proje-kaynak-analizi-master-plan.md "
          grep -q 'Pass A also receives a bounded follow-up context envelope' docs/proje-kaynak-analizi-master-plan.md
          grep -q 'seed.*prior id into the candidate set.*before' docs/proje-kaynak-analizi-master-plan.md
          grep -q 'authorized rows before user filter, rows after filter' docs/proje-kaynak-analizi-master-plan.md
          grep -q 'model-facing packet contains \*\*no pre-RLS row count\*\*' docs/proje-kaynak-analizi-master-plan.md
          ! grep -q 'rows before/after RLS & filter' docs/proje-kaynak-analizi-master-plan.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/pr694-remaining-codex-fixes.yml docs/proje-kaynak-analizi-master-plan.md
          git commit -m "docs: address remaining Codex review findings"
          git push origin HEAD:pk/rebuild
