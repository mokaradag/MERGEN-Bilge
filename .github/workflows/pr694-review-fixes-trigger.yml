name: Trigger PR 694 review-fix patch

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/pr694-review-fixes-trigger.yml

permissions:
  contents: write

jobs:
  run-patch:
    if: github.event.pull_request.number == 694 && github.event.pull_request.head.ref == 'pk/rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pk/rebuild
          fetch-depth: 0

      - name: Extract and run patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/pr694-review-fixes.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit corrected plan"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/pr694_patch.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/pr694_patch.py
          rm -f .github/workflows/pr694-review-fixes-trigger.yml

      - name: Commit corrected plan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/proje-kaynak-analizi-master-plan.md .github/workflows/pr694-review-fixes.yml .github/workflows/pr694-review-fixes-trigger.yml
          git diff --cached --check
          git commit -m "docs: address remaining Codex P1 and P2 findings"
          git push origin HEAD:pk/rebuild
