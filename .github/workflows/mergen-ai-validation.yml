name: MERGEN AI Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: "Validation profile"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full
      boot_smoke:
        description: "Boot the Shiny app and perform an HTTP smoke test"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  validate:
    name: Validate MERGEN Bilge
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      TZ: UTC
      MERGEN_RUN_APP: "false"
      MERGEN_DISABLE_FUTURES: "true"
      LOCAL_LLM_ENDPOINT: "http://test.local/v1"
      DB_DSN: "test-dsn"
      AI_KEYS_MASTER: "test-master-key-0123456789"
      R_KEEP_PKG_SOURCE: "no"
      RSPM: "https://packagemanager.posit.co/cran/__linux__/jammy/latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            curl \
            git \
            pandoc \
            unixodbc-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff5-dev \
            libudunits2-dev \
            libpoppler-cpp-dev \
            libgit2-dev \
            libglpk-dev \
            libavfilter-dev \
            libavformat-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavutil-dev \
            libswscale-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Show R and Rscript
        run: |
          which R
          which Rscript
          R --version
          Rscript --version

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/R
            ~/R
            /home/runner/work/_temp/Library
          key: r-lib-${{ runner.os }}-${{ hashFiles('R/config_packages.R', 'tests/scripts/ci_install_packages.R') }}
          restore-keys: |
            r-lib-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript tests/scripts/ci_install_packages.R

      - name: Decide validation mode
        id: mode
        shell: bash
        run: |
          PROFILE="${{ inputs.profile || 'quick' }}"
          BOOT_SMOKE="${{ inputs.boot_smoke || 'false' }}"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            PROFILE="full"
            BOOT_SMOKE="true"
          fi

          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"
          echo "boot_smoke=${BOOT_SMOKE}" >> "$GITHUB_OUTPUT"

          echo "Selected profile: ${PROFILE}"
          echo "Boot smoke: ${BOOT_SMOKE}"

      - name: Run AI repository validation
        shell: bash
        run: |
          ARGS=(--profile "${{ steps.mode.outputs.profile }}")

          if [[ "${{ steps.mode.outputs.boot_smoke }}" == "true" ]]; then
            ARGS+=(--boot-smoke)
          fi

          Rscript tests/scripts/ai_repo_check.R "${ARGS[@]}"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mergen-ai-validation-artifacts
          path: artifacts/ai-validation
          if-no-files-found: ignore