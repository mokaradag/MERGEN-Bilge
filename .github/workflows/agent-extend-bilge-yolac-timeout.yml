name: Apply Bilge Yolac 4h timeout update

on:
  push:
    branches:
      - agent/extend-bilge-yolac-timeout-4h

permissions:
  contents: write

jobs:
  apply-timeout-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/extend-bilge-yolac-timeout-4h
          fetch-depth: 0

      - name: Apply byte-preserving timeout updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def newline(data: bytes) -> bytes:
              return b"\r\n" if b"\r\n" in data else b"\n"

          def replace_once_or_done(path: str, old: bytes, new: bytes) -> None:
              p = Path(path)
              data = p.read_bytes()
              if new in data and old not in data:
                  return
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one old value, found {count}")
              p.write_bytes(data.replace(old, new, 1))

          replace_once_or_done(
              "R/config_claude_code.R",
              b'Sys.getenv("CLAUDE_CODE_TIMEOUT", "600")',
              b'Sys.getenv("CLAUDE_CODE_TIMEOUT", "14400")',
          )

          env_path = Path(".Renviron.example")
          env_data = env_path.read_bytes()
          if b"CLAUDE_CODE_TIMEOUT=14400" not in env_data:
              nl = newline(env_data)
              anchor = b"CLAUDE_CODE_DEFAULT_WORKDIR=C:/Temp/mergen_claude" + nl
              insertion = (
                  anchor
                  + b"# Bilge Yolac ajan calistirma zaman asimi (saniye). 14400 = 4 saat." + nl
                  + b"CLAUDE_CODE_TIMEOUT=14400" + nl
              )
              if env_data.count(anchor) != 1:
                  raise SystemExit(".Renviron.example: workdir anchor is not unique")
              env_path.write_bytes(env_data.replace(anchor, insertion, 1))

          docs_path = Path("docs/technical-reference.md")
          docs_data = docs_path.read_bytes()
          if b"CLAUDE_CODE_TIMEOUT=14400" not in docs_data:
              nl = newline(docs_data)
              old = b"CLAUDE_CODE_TIMEOUT=600"
              new = (
                  b"# Ajan gorevleri icin varsayilan ust sinir: 14.400 saniye (4 saat)"
                  + nl
                  + b"CLAUDE_CODE_TIMEOUT=14400"
              )
              if docs_data.count(old) != 1:
                  raise SystemExit("technical-reference: old timeout is not unique")
              docs_path.write_bytes(docs_data.replace(old, new, 1))
          PY

      - name: Verify focused timeout contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          checks = {
              "R/config_claude_code.R": [b'CLAUDE_CODE_TIMEOUT", "14400"'],
              "R/module_settings_yapilandirma_ui.R": [b"max = 14400", b"step = 300", b"en fazla 4 saat"],
              ".Renviron.example": [b"CLAUDE_CODE_TIMEOUT=14400"],
              "docs/technical-reference.md": [b"CLAUDE_CODE_TIMEOUT=14400", b"14.400 saniye (4 saat)"],
              "tests/testthat/test-claude-code-timeout-default-contract.R": [b"timeout defaults to four hours"],
          }
          for path, needles in checks.items():
              data = Path(path).read_bytes()
              for needle in needles:
                  if needle not in data:
                      raise SystemExit(f"{path}: missing {needle!r}")
          PY

      - name: Commit and push updates
        shell: bash
        run: |
          if git diff --quiet -- R/config_claude_code.R .Renviron.example docs/technical-reference.md; then
            echo "Timeout files are already updated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/config_claude_code.R .Renviron.example docs/technical-reference.md
          git commit -m "Extend Bilge Yolaç timeout to four hours"
          git push origin HEAD:agent/extend-bilge-yolac-timeout-4h
