name: Apply and validate PR 688 Codex P2 fixes

on:
  pull_request:
    branches:
      - automation/codex-p2-pr688-runner
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: write

concurrency:
  group: codex-p2-pr688-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    if: github.event.pull_request.head.ref == 'agent/update-help-center-guide'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      MERGEN_DISABLE_FUTURES: "true"
      MERGEN_RUN_APP: "false"
      MERGEN_SQL_LOADER_STRICT: "false"
      LOCAL_LLM_ENDPOINT: "http://test.local/v1"
      DB_DSN: "test-dsn"
      AI_KEYS_MASTER: "test-master-key-ci-placeholder"

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-help-center-guide
          fetch-depth: 0

      - name: Apply targeted fixes and regressions
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          module_path = "R/module_destek_yardim.R"
          guide_path = "ai_rehber.md"
          test_path = "tests/testthat/test-destek-yardim-behavior.R"

          replace_once(
              module_path,
              '''    # En yeni mesajları toplam bütçeyi aşmadan ve sıralarını koruyarak seç.
    destek_gecmis_sec <- function(gecmis, bayt_butcesi) {
      bayt_butcesi <- suppressWarnings(as.integer(bayt_butcesi))
      if (!is.list(gecmis) || length(gecmis) == 0L ||
          is.na(bayt_butcesi) || bayt_butcesi <= 0L) return(list())

      secilenler <- list()
      kalan <- bayt_butcesi
      for (i in rev(seq_along(gecmis))) {
        m <- gecmis[[i]]
        gereken <- destek_mesaj_baytlari(list(m))
        if (gereken <= kalan || length(secilenler) == 0L) {
          if (gereken > kalan) {
            rol_bayti <- destek_bayt_sayisi(m$role %||% "") + 64L
            m$content <- destek_bayta_kirp(m$content %||% "", max(0L, kalan - rol_bayti))
            gereken <- destek_mesaj_baytlari(list(m))
          }
          secilenler <- c(list(m), secilenler)
          kalan <- max(0L, kalan - gereken)
        }
        if (kalan < 128L) break
      }
      secilenler
    }
''',
              '''    # En yeni mesajları toplam bütçeyi aşmadan ve sıralarını koruyarak seç.
    destek_gecmis_sec <- function(gecmis, bayt_butcesi) {
      bayt_butcesi <- suppressWarnings(as.integer(bayt_butcesi))
      if (!is.list(gecmis) || length(gecmis) == 0L ||
          is.na(bayt_butcesi) || bayt_butcesi <= 0L) return(list())

      secilenler <- list()
      kalan <- bayt_butcesi
      for (i in rev(seq_along(gecmis))) {
        m <- gecmis[[i]]
        gereken <- destek_mesaj_baytlari(list(m))

        if (gereken <= kalan) {
          secilenler <- c(list(m), secilenler)
          kalan <- kalan - gereken
        } else if (length(secilenler) == 0L) {
          rol_bayti <- destek_bayt_sayisi(m$role %||% "") + 64L
          if (rol_bayti < kalan) {
            m$content <- destek_bayta_kirp(m$content %||% "", kalan - rol_bayti)
            gereken <- destek_mesaj_baytlari(list(m))
            if (gereken <= kalan) {
              secilenler <- c(list(m), secilenler)
              kalan <- kalan - gereken
            }
          }
        }

        if (kalan < 128L) break
      }
      secilenler
    }
''',
              "history budget safety",
          )

          replace_once(
              module_path,
              '''        bilgi_icerigi <- destek_guvenli_utf8(bilgi_tabani)
        max_yanit_token <- 4096L
        context_token_limiti <- destek_env_tamsayi(
          c(
            "DESTEK_CHATBOT_CONTEXT_TOKENS",
            "AI_EXPERT_CONTEXT_TOKENS",
            "LOCAL_LLM_CONTEXT_TOKENS"
          ),
          varsayilan = 32768L
        )
        context_token_limiti <- max(context_token_limiti, max_yanit_token + 8192L)
        girdi_butcesi <- context_token_limiti - max_yanit_token - 1024L
''',
              '''        bilgi_icerigi <- destek_guvenli_utf8(bilgi_tabani)
        context_token_limiti <- destek_env_tamsayi(
          c(
            "DESTEK_CHATBOT_CONTEXT_TOKENS",
            "AI_EXPERT_CONTEXT_TOKENS",
            "LOCAL_LLM_CONTEXT_TOKENS"
          ),
          varsayilan = 32768L
        )

        # Yapılandırılan bağlam sınırını yükseltmeden yanıt ve güvenlik payını uyarla.
        guvenlik_payi <- min(
          1024L,
          max(128L, as.integer(floor(context_token_limiti * 0.0625)))
        )
        max_yanit_token <- min(
          4096L,
          max(256L, as.integer(floor(context_token_limiti * 0.25)))
        )
        if (context_token_limiti <= guvenlik_payi + max_yanit_token) {
          stop("Yardım Asistanı bağlam sınırı giriş ve yanıt bütçesi için yetersiz.")
        }
        girdi_butcesi <- context_token_limiti - max_yanit_token - guvenlik_payi
''',
              "adaptive configured context",
          )

          replace_once(
              module_path,
              '          "ve kullaniciyi E-posta Destek (REHIS Proje Yönetimi Birimi) veya Telefon Destek (81875) kanallarina yonlendir.\\n\\n",\n',
              '          "ve kullaniciyi E-posta Destek (destek@mergen.ai) veya Telefon Destek (+90 850 123 45 67) kanallarina yonlendir.\\n\\n",\n',
              "canonical prompt contacts",
          )

          replace_once(
              module_path,
              '''        # Geçmiş ve rehber aynı toplam bağlam bütçesini paylaşır.
        sabit_mesajlar <- list(
          list(role = "system", content = sistem_mesaji),
          list(role = "assistant", content = hazirlik_mesaji)
        )
        asgari_rehber_butcesi <- min(8192L, max(2048L, as.integer(girdi_butcesi * 0.35)))
        gecmis_butcesi <- min(
          12000L,
          max(1024L, girdi_butcesi - destek_mesaj_baytlari(sabit_mesajlar) -
                destek_bayt_sayisi(bilgi_on_eki) - 64L - asgari_rehber_butcesi)
        )
        son_mesajlar <- destek_gecmis_sec(tail(gecmis, 10), gecmis_butcesi)
        sabit_bayt <- destek_mesaj_baytlari(c(sabit_mesajlar, son_mesajlar)) +
          destek_bayt_sayisi(bilgi_on_eki) + 64L
        rehber_butcesi <- max(1024L, girdi_butcesi - sabit_bayt)
        secili_bilgi <- destek_rehber_sec(bilgi_icerigi, kullanici_mesaji, rehber_butcesi)
''',
              '''        # Geçmiş ve rehber aynı toplam bağlam bütçesini paylaşır.
        sabit_mesajlar <- list(
          list(role = "system", content = sistem_mesaji),
          list(role = "assistant", content = hazirlik_mesaji)
        )
        sabit_bayt <- destek_mesaj_baytlari(sabit_mesajlar) +
          destek_bayt_sayisi(bilgi_on_eki) + 64L
        if (sabit_bayt >= girdi_butcesi) {
          stop("Yardım Asistanı bağlam sınırı sabit istem iletileri için yetersiz.")
        }

        degisken_butcesi <- girdi_butcesi - sabit_bayt
        rehber_hedef_butcesi <- min(
          8192L,
          as.integer(floor(degisken_butcesi * 0.65))
        )
        gecmis_butcesi <- min(
          12000L,
          max(0L, degisken_butcesi - rehber_hedef_butcesi)
        )
        son_mesajlar <- destek_gecmis_sec(tail(gecmis, 10), gecmis_butcesi)
        rehber_butcesi <- max(
          0L,
          degisken_butcesi - destek_mesaj_baytlari(son_mesajlar)
        )
        secili_bilgi <- destek_rehber_sec(bilgi_icerigi, kullanici_mesaji, rehber_butcesi)
''',
              "shared adaptive input allocation",
          )

          replace_once(
              guide_path,
              '''İletişim bilgileri:
- E-posta: REHIS Proje Yönetim Birimi
- Telefon: 81875
''',
              '''İletişim bilgileri:
- E-posta: destek@mergen.ai
- Telefon: +90 850 123 45 67
''',
              "canonical guide contacts",
          )

          replace_once(
              test_path,
              '''                  session$setInputs(chatbot_mesaj = prime)
                  session$setInputs(chatbot_mesaj = message)
''',
              '''                  session$setInputs(chatbot_mesaj = prime)
                  for (mesaj in as.character(message)) {
                    session$setInputs(chatbot_mesaj = mesaj)
                  }
''',
              "multi-message test helper",
          )

          replace_once(
              test_path,
              '''# İstek mesajlarının bayt üst sınırı + ayrılan çıktı ve güvenlik payı.
.yardim_istek_butcesi <- function(body) {
  mesaj_bayti <- sum(vapply(body$messages, function(m) {
    nchar(m$role, type = "bytes") + nchar(m$content, type = "bytes") + 64L
  }, numeric(1)))
  mesaj_bayti + body$max_tokens + 1024L
}
''',
              '''# Yapılandırılan bağlam için ayrılan güvenlik payını üretim koduyla aynı hesapla.
.yardim_guvenlik_payi <- function(context_token_limiti) {
  min(1024L, max(128L, as.integer(floor(context_token_limiti * 0.0625))))
}

# İstek mesajlarının bayt üst sınırı + ayrılan çıktı ve güvenlik payı.
.yardim_istek_butcesi <- function(body, context_token_limiti = 16384L) {
  mesaj_bayti <- sum(vapply(body$messages, function(m) {
    nchar(m$role, type = "bytes") + nchar(m$content, type = "bytes") + 64L
  }, numeric(1)))
  mesaj_bayti + body$max_tokens + .yardim_guvenlik_payi(context_token_limiti)
}
''',
              "dynamic request budget helper",
          )

          marker = '''# ------------------------------------------------------------------------------
# Boş mesaj guard'ı
# ------------------------------------------------------------------------------
'''
          tests = '''testthat::test_that("chatbot 4096 token bağlamı ve uzun geçmişi bütçe içinde tutar", {
  env <- .source_destek_yardim_for_test()
  repo_root <- resolve_repo_root_for_tests()
  withr::local_dir(repo_root)

  uzun_gecmis <- vapply(seq_len(6), function(i) {
    paste0("geçmiş-", i, "-", strrep("uzun içerik ", 180))
  }, character(1))
  rec <- .run_yardim_chat(env, c(
    LOCAL_LLM_ENDPOINT = "http://x/v1",
    DESTEK_CHATBOT_MODEL = "m",
    DESTEK_CHATBOT_CONTEXT_TOKENS = "4096"
  ), message = c(uzun_gecmis, "Bilge Savunması oyununda kuleleri nasıl geliştiririm?"))

  testthat::expect_identical(rec$body$max_tokens, 1024L)
  testthat::expect_lte(.yardim_istek_butcesi(rec$body, 4096L), 4096L)
  testthat::expect_true(grepl(
    "## 23. Bilge Savunması Kullanım Rehberi",
    rec$body$messages[[2]]$content,
    fixed = TRUE
  ))
  testthat::expect_true(any(vapply(rec$body$messages, function(m) {
    identical(m$role, "user") && grepl("Bilge Savunması", m$content, fixed = TRUE)
  }, logical(1))))
})

testthat::test_that("chatbot, rehber ve arayüz tek destek iletişim setini kullanır", {
  env <- .source_destek_yardim_for_test()
  repo_root <- resolve_repo_root_for_tests()
  withr::local_dir(repo_root)

  rec <- .run_yardim_chat(env, c(
    LOCAL_LLM_ENDPOINT = "http://x/v1",
    DESTEK_CHATBOT_MODEL = "m"
  ), message = "Kapsam dışı bir konuda nasıl destek alırım?")

  sistem_mesaji <- rec$body$messages[[1]]$content
  rehber <- paste(readLines(file.path(repo_root, "ai_rehber.md"),
                            encoding = "UTF-8", warn = FALSE), collapse = "\n")
  modul <- paste(readLines(file.path(repo_root, "R", "module_destek_yardim.R"),
                           encoding = "UTF-8", warn = FALSE), collapse = "\n")

  for (metin in list(sistem_mesaji, rehber, modul)) {
    testthat::expect_true(grepl("destek@mergen.ai", metin, fixed = TRUE))
    testthat::expect_true(grepl("+90 850 123 45 67", metin, fixed = TRUE))
  }
  testthat::expect_false(grepl("81875", paste(rehber, modul), fixed = TRUE))
  testthat::expect_false(grepl("REHIS Proje Yönetim", paste(rehber, modul), fixed = TRUE))
})

'''
          replace_once(test_path, marker, tests + marker, "P2 regression tests")

      - name: Verify textual invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "81875" R/module_destek_yardim.R ai_rehber.md
          ! grep -R "REHIS Proje Yönetim" R/module_destek_yardim.R ai_rehber.md
          grep -q "destek@mergen.ai" R/module_destek_yardim.R
          grep -Fq "+90 850 123 45 67" ai_rehber.md
          ! grep -q "context_token_limiti <- max" R/module_destek_yardim.R
          git diff --check

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install targeted dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::withr
            any::shiny
            any::shinyjs
            any::httr
            any::jsonlite
          needs: check

      - name: Parse and run Yardım Merkezi behavior tests
        shell: Rscript {0}
        run: |
          parse("R/module_destek_yardim.R", encoding = "UTF-8")
          testthat::test_file(
            "tests/testthat/test-destek-yardim-behavior.R",
            reporter = "summary",
            stop_on_failure = TRUE
          )

      - name: Restore workflow, commit, and push fixes
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/module_destek_yardim.R ai_rehber.md tests/testthat/test-destek-yardim-behavior.R .github/workflows/tests.yml
          git diff --cached --check
          git commit -m "fix: honor support chatbot context limits"
          git push origin HEAD:agent/update-help-center-guide
