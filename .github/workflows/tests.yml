name: R tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testthat:
    timeout-minutes: 120
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / R ${{ matrix.r }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        r: ["4.6.0"]

    env:
      # MERGEN paralel cluster ve gc scheduler gibi arka plan kancaları
      # testlerde devre dışı bırakılır. helper_bootstrap.R bu bayrağı zaten
      # ayarlar; CI ortamında explicit olması da netlik sağlar.
      MERGEN_DISABLE_FUTURES: "true"
      MERGEN_RUN_APP: "false"
      MERGEN_SQL_LOADER_STRICT: "false"

      # config_file_store.R bu üç değişkeni zorunlu sayar; CI içinde sadece
      # placeholder değerler verilir. Gerçek sırları kullanmazlar.
      LOCAL_LLM_ENDPOINT: "http://test.local/v1"
      DB_DSN: "test-dsn"
      AI_KEYS_MASTER: "test-master-key-ci-placeholder"

      # Test ve smoke akışlarında dosya sistemi çakışmalarını önlemek için
      # CI içinde izole çalışma dizinleri kullanılabilir.
      R_KEEP_PKG_SOURCE: "yes"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R ${{ matrix.r }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            unixodbc-dev

      # NOT: asagidaki `packages: |` blok skaleri yalnizca paket belirtimi icermelidir.
      # Icine yazilan `# ...` satirlari YAML yorumu degil, girdi degerinin parcasidir ve
      # pak::lockfile_create() tarafindan paket adi gibi ayristirilir. Aciklamalar bu
      # blogun disinda tutulmalidir. RSQLite, config_packages.R icindeki
      # `required_packages` listesinde oldugu icin zorunludur: eksik oldugunda acilis
      # stop() eder ve 'App boot smoke' adimi kirilir.
      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::withr
            any::arrow
            any::base64enc
            any::cellranger
            any::cli
            any::commonmark
            any::curl
            any::data.table
            any::DBI
            any::dplyr
            any::DT
            any::duckdb
            any::fastmatch
            any::fs
            any::future
            any::glue
            any::highcharter
            any::htmltools
            any::httr
            any::jsonlite
            any::later
            any::logger
            any::lubridate
            any::markdown
            any::odbc
            any::openssl
            any::pdftools
            any::pool
            any::promises
            any::purrr
            any::readr
            any::readxl
            any::RSQLite
            any::shiny
            any::shinyBS
            any::shinycssloaders
            any::shinydashboard
            any::shinyjs
            any::shinyWidgets
            any::stringdist
            any::stringi
            any::stringr
            any::tibble
            any::tidyr
            any::urltools
            any::writexl
            any::xml2
            any::av
          needs: check

      - name: Parse sanity check
        shell: Rscript {0}
        run: |
          source("tests/scripts/parse_sanity_check.R", encoding = "UTF-8")

      - name: App boot smoke
        shell: Rscript {0}
        run: |
          source("tests/scripts/smoke_app_boot.R", encoding = "UTF-8")

      - name: Run testthat
        shell: Rscript {0}
        run: |
          # Repo kökünden çalıştırılır; tests/testthat.R ana giriş noktasıdır.
          source("tests/testthat.R", encoding = "UTF-8")