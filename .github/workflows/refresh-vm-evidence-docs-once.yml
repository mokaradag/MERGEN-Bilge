name: Refresh VM evidence docs once

on:
  push:
    branches:
      - pk/rebuild
    paths:
      - .github/workflows/refresh-vm-evidence-docs-once.yml

permissions:
  contents: write

jobs:
  refresh-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pk/rebuild
          fetch-depth: 0

      - name: Update current VM evidence references
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("docs/release-notes.md"): [
                  (
                      "### (Yayınlanmadı) 2026-07-28 Windows VM evidence gate yeniden doğrulaması",
                      "### (Yayınlanmadı) 2026-08-17 Windows VM evidence gate yeniden doğrulaması",
                  ),
                  (
                      "artifacts/vm-evidence/20260728-184747/evidence.json",
                      "artifacts/vm-evidence/20260817-065352/evidence.json",
                  ),
              ],
              Path("RUNBOOK.md"): [
                  (
                      "28 Temmuz 2026 tarihli son VM evidence gate koşumu başarılıdır:",
                      "17 Ağustos 2026 tarihli son VM evidence gate koşumu başarılıdır:",
                  ),
                  (
                      "28 Temmuz 2026 koşumunda `full_testthat`",
                      "17 Ağustos 2026 koşumunda `full_testthat`",
                  ),
                  (
                      "2026-06-12 tarihinde Windows VM üzerinde tam evidence gate milestone'u kaydedildi; sonraki başarılı yeniden doğrulamalar 2026-06-15, 2026-07-21 ve 2026-07-26 tarihlerinde, en son başarılı yeniden doğrulama ise 2026-07-28 tarihinde alındı:",
                      "2026-06-12 tarihinde Windows VM üzerinde tam evidence gate milestone'u kaydedildi; sonraki başarılı yeniden doğrulamalar 2026-06-15, 2026-07-21, 2026-07-26 ve 2026-07-28 tarihlerinde, en son başarılı yeniden doğrulama ise 2026-08-17 tarihinde alındı:",
                  ),
                  (
                      "artifacts/vm-evidence/20260728-184747/evidence.json",
                      "artifacts/vm-evidence/20260817-065352/evidence.json",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count < 1:
                      raise SystemExit(f"Expected marker not found in {path}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/refresh-vm-evidence-docs-once.yml").unlink()

      - name: Commit documentation refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RUNBOOK.md docs/release-notes.md .github/workflows/refresh-vm-evidence-docs-once.yml
          git commit -m "docs: record 17 Aug 2026 VM evidence pass"
          git push origin HEAD:pk/rebuild
