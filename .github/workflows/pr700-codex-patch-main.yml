name: PR700 Codex patch via main PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch-reviewed-lines:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply reviewed-line fixes
        run: python tools/pr700_codex_patch.py
      - name: Commit fixes when needed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/helpers_pk_query_selection_ai.R R/module_proje_kaynak_analizi.R .Renviron.example R/helpers_deep_analysis.R R/helpers_pk_query_selection_apply.R tests/testthat/test-pk-query-selection-contract.R
          git commit -m "fix(pk): apply direct Codex follow-up fixes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
