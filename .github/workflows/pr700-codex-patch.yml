name: PR700 Codex patch

on:
  push:
    branches:
      - fix/pr700-codex-final

permissions:
  contents: write

jobs:
  patch-reviewed-lines:
    if: github.event.head_commit.message != 'fix(pk): apply direct Codex follow-up fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr700-codex-final
          fetch-depth: 0

      - name: Apply exact reviewed-line fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          # P2: final Pass-B candidate set must never exceed recall_n.
          replace_once(
              "R/helpers_pk_query_selection_ai.R",
              '''#' Geçiş A adaylarını, ÖNCEKİ kararlı sorgu kimliğiyle tohumla (§5.2)
#'
#' Eksiltili takip sorularında ("peki 2024 için?") soru metninde artık hiçbir
#' sorgu-taşıyıcı terim yoktur; Geçiş A doğru sorguyu bulamaz.
#'
#' TOHUM TAZE BİR ADAYI DÜŞÜREMEZ: önceki kimlik eskiden koşulsuz başa
#' ekleniyor ve `head(recall_n)` SON adayı atıyordu. Yeni bir konuda Geçiş A
#' doğru biçimde `q2,q3,q4` derken bayat `q1` yüzünden `q4` geri alınamaz
#' biçimde kayboluyordu. Tohum artık recall kümesine EK olarak taşınır.
pk_select_seed_candidates <- function(recalled_ids, prior_query_id, cfg) {
  aday <- as.character(recalled_ids)
  aday <- unique(aday[!is.na(aday) & nzchar(aday)])
  aday <- utils::head(aday, cfg$recall_n)

  if (is.null(prior_query_id) || !length(prior_query_id) ||
      is.na(prior_query_id[1]) || !nzchar(trimws(as.character(prior_query_id)[1]))) {
    return(aday)
  }

  onceki <- trimws(as.character(prior_query_id)[1])
  if (onceki %in% aday) return(aday)

  # Tohum EN BAŞA konur (eksiltili takipte en güçlü aday odur) ama hiçbir taze
  # adayı düşürmez: küme bir eleman büyür.
  c(onceki, aday)
}
''',
              '''#' Geçiş A adaylarını, ÖNCEKİ kararlı sorgu kimliğiyle tohumla (§5.2)
#'
#' Eksiltili takip sorularında ("peki 2024 için?") soru metninde artık hiçbir
#' sorgu-taşıyıcı terim yoktur; Geçiş A doğru sorguyu bulamaz. Önceki kararlı
#' kimlik bu nedenle SON aday kümesi kurulmadan önce başa tohumlanır.
#'
#' `recall_n` Geçiş B'nin SERT aday tavanıdır. Önceki kimlik taze recall'da
#' yoksa onun için bir yuva ayrılır; kalan yuvalar Geçiş A sırasından doldurulur.
#' Böylece takip bağlamı korunurken istem/çıktı bütçesi recall_n+1'e büyümez.
pk_select_seed_candidates <- function(recalled_ids, prior_query_id, cfg) {
  aday <- as.character(recalled_ids)
  aday <- unique(aday[!is.na(aday) & nzchar(aday)])
  sinir <- suppressWarnings(as.integer(cfg$recall_n)[1])
  if (!length(sinir) || is.na(sinir) || sinir < 1L) return(character(0))

  if (is.null(prior_query_id) || !length(prior_query_id) ||
      is.na(prior_query_id[1]) || !nzchar(trimws(as.character(prior_query_id)[1]))) {
    return(utils::head(aday, sinir))
  }

  onceki <- trimws(as.character(prior_query_id)[1])
  utils::head(unique(c(onceki, aday)), sinir)
}
'''
          )

          # P2: isolated module loading must include the extracted v1 AI selector.
          replace_once(
              "R/module_proje_kaynak_analizi.R",
              '''  list(
    functions = c(
      "pk_init_query_score_table",
      "pk_score_query_relevance",
      "pk_compute_heuristic_query_scores",
      "print_score_table"
    ),
    path = file.path("R", "helpers_pk_analysis_query_selection.R")
  ),
  # Faz 5 (§5.2) iki geçişli seçim zinciri.''',
              '''  list(
    functions = c(
      "pk_init_query_score_table",
      "pk_score_query_relevance",
      "pk_compute_heuristic_query_scores",
      "print_score_table"
    ),
    path = file.path("R", "helpers_pk_analysis_query_selection.R")
  ),
  list(
    functions = c("find_best_query_with_ai", "find_multiple_queries_with_ai"),
    path = file.path("R", "helpers_pk_analysis_ai_selector.R")
  ),
  # Faz 5 (§5.2) iki geçişli seçim zinciri.'''
          )

          # P2: confidence and margin are independent gates; their sum is not a constraint.
          replace_once(
              ".Renviron.example",
              '''#   Tepe aday ile ikinci aday arasındaki asgari fark. Altında kalırsa yakın
#   beraberlik sayılır ve yine sorulur. MIN_CONFIDENCE + MIN_MARGIN toplamı
#   100'ü aşarsa hiçbir aday geçemez; bu yapılandırma AÇIK hata verir.
# MERGEN_PK_SELECT_MIN_MARGIN=15''',
              '''#   Tepe aday ile ikinci aday arasındaki asgari fark. Altında kalırsa yakın
#   beraberlik sayılır ve yine sorulur. MIN_CONFIDENCE ile MIN_MARGIN farklı
#   nicelikleri sınırlar; toplamlarının 100'ü aşması geçersiz DEĞİLDİR. Her iki
#   kapının da 0 olması otomatik seçimi korumasız bırakacağı için reddedilir.
# MERGEN_PK_SELECT_MIN_MARGIN=15'''
          )

          # P1: v2 Deep Thinking must preserve safe multi-query execution.
          deep = Path("R/helpers_deep_analysis.R")
          text = deep.read_text(encoding="utf-8")
          start = text.index('  # Faz 5 motor sınırı (§5.2 / §10):')
          end = text.index('  cat(sprintf("[DEEP_ANALYSIS] %d sorgu işlenecek.', start)
          new_block = '''  # Faz 5 motor sınırı (§5.2 / §10): `MERGEN_PK_ENGINE=v2` iken Derin Düşünme de
  # aynı iki geçişli güven/marj/yetenek kapılarından geçer. Ek sorgular yalnızca
  # Geçiş B'nin kararlı-kimlikli ve bağımsız metadata/yetenek kontrollerini geçen
  # alternatiflerinden alınır; legacy konum-kimlikli çoklu seçici v2'de çağrılmaz.
  pk_v2_secim <- exists("pk_engine_is_v2", mode = "function", inherits = TRUE) &&
    isTRUE(pk_engine_is_v2()) &&
    exists("pk_select_queries_v2", mode = "function", inherits = TRUE)

  v2_secim_sonucu <- NULL
  if (pk_v2_secim) {
    v2_secim_sonucu <- pk_select_queries_v2(
      user_prompt, query_library, chat_history,
      session = session, stop_check = stop_check, max_queries = 5L
    )
    selected_queries <- v2_secim_sonucu$queries %||% list()
  } else {
    selected_queries <- find_multiple_queries_with_ai(
      user_prompt, query_library, session, max_queries = 5
    )
  }

  if (is.null(selected_queries) || length(selected_queries) == 0) {
    cat("[DEEP_ANALYSIS] Tekil secime dusuluyor.\\n")
    single <- if (pk_v2_secim && is.list(v2_secim_sonucu)) {
      v2_secim_sonucu$primary
    } else {
      select_smart_query(
        user_prompt, query_library, chat_history,
        session = session, stop_check = stop_check
      )
    }

    # v2 acikca "bilmiyorum" dediyse Derin Dusunme de calistirmaz.
    if (is.list(single) && is.null(single$id) && !is.null(single$refusal_message)) {
      pk_observe_deep(list(
        query_name = "Derin analiz", filter_status = "not_reached",
        filters = list(), outcome = "Reddedildi"
      ))
      return(as.character(single$refusal_message)[1])
    }

    if (!is.null(single) && !is.null(single$id)) {
      selected_queries <- list(single)
    } else {
      pk_observe_deep(list(
        query_name = "Derin analiz",
        filter_status = "not_reached",
        filters = list(),
        outcome = "EslesmeYok"
      ))
      return("\\U0001F914 Aradığınız bilgi mevcut analiz kütüphanesinde bulunamadı. Lütfen sorunuzu farklı kelimelerle deneyin.")
    }
  }

'''
          deep.write_text(text[:start] + new_block + text[end:], encoding="utf-8", newline="\n")

          # Commit the v2 primary only after the existing selection-level stop gate.
          text = deep.read_text(encoding="utf-8")
          needle = '''  query_results <- list()
  for (i in seq_along(selected_queries)) {'''
          replacement = '''  if (pk_v2_secim && length(selected_queries) > 0L &&
      exists("pk_select_commit_selection", mode = "function", inherits = TRUE)) {
    try(pk_select_commit_selection(selected_queries[[1]], session), silent = TRUE)
  }

  query_results <- list()
  for (i in seq_along(selected_queries)) {'''
          if text.count(needle) != 1:
              raise SystemExit("helpers_deep_analysis.R: commit insertion point mismatch")
          deep.write_text(text.replace(needle, replacement, 1), encoding="utf-8", newline="\n")

          # Remove compatibility-only shims now that the reviewed source lines are fixed.
          p = Path("R/helpers_pk_query_selection_apply.R")
          text = p.read_text(encoding="utf-8")
          text, n1 = re.subn(
              r'\n# İZOLE `module_proje_kaynak_analizi\.R` yüklemesinde.*?\nrm\(\.pk_v1_selector_path\)\n',
              '\n', text, count=1, flags=re.S
          )
          text, n2 = re.subn(
              r'\n# Geçiş A\'dan gelen taze adaylar.*?\n}\n\n#\' Karardan v1 uyumlu',
              "\n#' Karardan v1 uyumlu", text, count=1, flags=re.S
          )
          marker = '\n# Derin analiz dosyası bu helper\'dan ÖNCE yüklenir.'
          n3 = 1 if marker in text else 0
          if n3:
              text = text.split(marker, 1)[0].rstrip() + "\n"
          if (n1, n2, n3) != (1, 1, 1):
              raise SystemExit(f"apply shim cleanup mismatch: {(n1, n2, n3)}")
          p.write_text(text, encoding="utf-8", newline="\n")

          # Update the contract tests to the corrected hard recall_n bound.
          replace_once(
              "tests/testthat/test-pk-query-selection-contract.R",
              '''test_that("eksiltili takipte önceki kimlik KIRPMADAN ÖNCE tohumlanır", {
  cfg <- .pk_sel_cfg(recall_n = 3L)

  # Geçiş A önceki sorguyu (q001) hiç döndürmedi ve tam 3 aday verdi.
  # Tohumlama KIRPMADAN ÖNCE yapıldığı için q001 kümede kalmalıdır.
  adaylar <- pk_select_seed_candidates(c("q002", "q003", "q004"), "q001", cfg)

  expect_identical(adaylar[1], "q001")
  expect_true(
    "q001" %in% adaylar,
    info = paste(
      "Geçiş A, Geçiş B konuşmayı inceleyemeden TEK sorgu-taşıyıcı bağlamı",
      "atmamalıdır (§5.2)."
    )
  )
  # TOHUM TAZE BİR ADAYI DÜŞÜREMEZ: eskiden `head(recall_n)` son adayı atıyordu
  # ve yeni bir konuda bayat önceki kimlik yüzünden `q004` geri alınamaz
  # biçimde kayboluyordu. Küme bir eleman BÜYÜR.
  expect_identical(adaylar, c("q001", "q002", "q003", "q004"))
  expect_true(all(c("q002", "q003", "q004") %in% adaylar))
})

test_that("tohum, Geçiş A'nın taze adaylarını DÜŞÜRMEZ", {
  cfg <- .pk_sel_cfg(recall_n = 3L)
  taze <- c("q002", "q003", "q004")

  adaylar <- pk_select_seed_candidates(taze, "q001", cfg)
  expect_true(all(taze %in% adaylar))
  expect_equal(length(adaylar), 4L)

  # Tohum yoksa kırpma normal biçimde uygulanır.
  expect_equal(length(pk_select_seed_candidates(c("q001", "q002", "q003", "q004"), NULL, cfg)), 3L)
})''',
              '''test_that("eksiltili takipte önceki kimlik SON recall_n kümesine tohumlanır", {
  cfg <- .pk_sel_cfg(recall_n = 3L)

  # Geçiş A önceki sorguyu (q001) hiç döndürmedi ve tam 3 aday verdi.
  # q001 korunur, fakat Geçiş B aday kümesi yine recall_n=3 sınırını aşmaz.
  adaylar <- pk_select_seed_candidates(c("q002", "q003", "q004"), "q001", cfg)

  expect_identical(adaylar, c("q001", "q002", "q003"))
  expect_equal(length(adaylar), cfg$recall_n)
  expect_false("q004" %in% adaylar)
})

test_that("tohum için ayrılan yuva recall_n bütçesini büyütmez", {
  cfg <- .pk_sel_cfg(recall_n = 3L)
  taze <- c("q002", "q003", "q004")

  adaylar <- pk_select_seed_candidates(taze, "q001", cfg)
  expect_identical(adaylar, c("q001", "q002", "q003"))
  expect_equal(length(adaylar), 3L)

  # Tohum yoksa kırpma normal biçimde uygulanır.
  expect_equal(length(pk_select_seed_candidates(c("q001", "q002", "q003", "q004"), NULL, cfg)), 3L)
})'''
          )

          replace_once(
              "tests/testthat/test-pk-query-selection-contract.R",
              '''  stub <- pk_select_stub_llm(list(
    "{\\"candidates\\":[\\"q002\\",\\"q003\\",\\"q004\\"]}",
    .pk_sel_pass_b(id = "q001", candidate_ids = c("q001", "q002", "q003", "q004"))
  ))''',
              '''  stub <- pk_select_stub_llm(list(
    "{\\"candidates\\":[\\"q002\\",\\"q003\\",\\"q004\\"]}",
    .pk_sel_pass_b(id = "q001", candidate_ids = c("q001", "q002", "q003"))
  ))'''
          )

          # Static regression checks for all five reviewed findings.
          checks = {
              "R/helpers_pk_query_selection_ai.R": ["utils::head(unique(c(onceki, aday)), sinir)"],
              "R/module_proje_kaynak_analizi.R": ["helpers_pk_analysis_ai_selector.R"],
              ".Renviron.example": ["toplamlarının 100'ü aşması geçersiz DEĞİLDİR"],
              "R/helpers_deep_analysis.R": ["pk_select_queries_v2(", "pk_select_commit_selection(selected_queries[[1]], session)"],
              "R/helpers_pk_query_selection_session.R": ["history_signatures", "intersect(imzalar, onceki)"],
          }
          for path, needles in checks.items():
              body = Path(path).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in body:
                      raise SystemExit(f"{path}: regression marker missing: {needle}")

      - name: Commit direct fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/helpers_pk_query_selection_ai.R R/module_proje_kaynak_analizi.R .Renviron.example R/helpers_deep_analysis.R R/helpers_pk_query_selection_apply.R tests/testthat/test-pk-query-selection-contract.R
          git commit -m "fix(pk): apply direct Codex follow-up fixes"
          git push origin HEAD:fix/pr700-codex-final
