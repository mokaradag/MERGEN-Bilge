name: Normalize VM evidence doc EOFs once

on:
  push:
    branches:
      - pk/rebuild
    paths:
      - .github/workflows/normalize-vm-doc-eof-once.yml

permissions:
  contents: write

jobs:
  normalize-eof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pk/rebuild
          fetch-depth: 0

      - name: Restore final newlines
        shell: python
        run: |
          from pathlib import Path

          for name in [
              "README.md",
              "docs/README.md",
              "docs/architecture-map.md",
              "docs/vm-evidence-status.md",
          ]:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if not text.endswith("\n"):
                  path.write_text(text + "\n", encoding="utf-8")

          Path(".github/workflows/normalize-vm-doc-eof-once.yml").unlink()

      - name: Commit newline cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README.md docs/architecture-map.md docs/vm-evidence-status.md .github/workflows/normalize-vm-doc-eof-once.yml
          git commit -m "chore: preserve documentation final newlines"
          git push origin HEAD:pk/rebuild
